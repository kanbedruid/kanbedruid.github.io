}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}

body{font-synthesis:none;height:100%;margin:0;font-size:12px;line-height:1.34;-webkit-font-smoothing:none;font-smooth:never;background:var(--bg);color:var(--cream);font-family:var(--f-sm);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bm{display:block;shape-rendering:crispEdges}
.pxb{box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:10px;height:32px}
.day{font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;background:var(--line)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--amber);animation:blink 1s steps(1) infinite}
.lives{display:flex;gap:5px;color:var(--pink)}
.lives .bm{width:16px;height:14px}
.lives .off{color:var(--line)}
.spacer{flex:1}
.icon{width:32px;height:30px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.icon .bm{width:16px;height:14px}
.lang{font-family:var(--f-px);font-weight:700;font-size:12px;width:auto;padding:0 8px}
.cjk .t1{letter-spacing:.04em}

/* Stage */
.stage{position:relative;flex:1 1 0;min-height:230px;background:var(--ink);display:grid;place-items:center;overflow:hidden;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#cv{transition:opacity .22s steps(4)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);background:var(--ink);padding:12px 16px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber);white-space:nowrap;letter-spacing:.06em;z-index:3}
.banner.boss{color:var(--red);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red);animation:shake .4s steps(4) 2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
.stamp{position:absolute;left:50%;top:40%;z-index:3;font-family:var(--f-px);font-weight:700;font-size:36px;line-height:1;padding:20px 26px;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-7deg);color:var(--green);background:rgba(13,11,20,.82);
  box-shadow:0 -6px 0 0 currentColor,0 6px 0 0 currentColor,-6px 0 0 0 currentColor,6px 0 0 0 currentColor;animation:thump .3s steps(3) both;text-shadow:3px 3px 0 #000}
.stamp.sm{font-size:24px;padding:16px 20px}
.stool{position:absolute;left:50%;top:40%;z-index:4;width:108px;height:99px;color:var(--green);pointer-events:none;animation:stampTool 1.15s steps(10) both;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.45))}
.stool svg{display:block;width:100%;height:100%}
.stool.miss{color:var(--red)}
@keyframes stampTool{0%{transform:translate(-50%,-260%) scale(1.3)}30%{transform:translate(-50%,-78%) scale(1)}42%{transform:translate(-50%,-72%) scale(.94,.9)}62%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(70%,-330%) rotate(14deg);opacity:0}}
.stamp.miss{color:var(--red)}
.stamp{pointer-events:none}
.stamp .qb .bm{display:inline-block;width:1em;height:1em;vertical-align:-3px;margin-right:6px;color:#ffd65a}
.erank .qs,.stamp .qs{position:absolute;width:3px;height:3px;background:var(--c,#fff1b8);box-shadow:0 -3px 0 var(--c,#fff1b8),0 3px 0 var(--c,#fff1b8),-3px 0 0 var(--c,#fff1b8),3px 0 0 var(--c,#fff1b8),0 -6px 0 var(--c,#fff1b8),0 6px 0 var(--c,#fff1b8),-6px 0 0 var(--c,#fff1b8),6px 0 0 var(--c,#fff1b8);transform:scale(0);animation:qtw .9s steps(1) infinite}
.erank .qs.s,.stamp .qs.s{box-shadow:0 -3px 0 var(--c,#fff1b8),0 3px 0 var(--c,#fff1b8),-3px 0 0 var(--c,#fff1b8),3px 0 0 var(--c,#fff1b8)}
@keyframes qtw{0%{transform:scale(0)}15%{transform:scale(.6)}30%{transform:scale(1)}45%{transform:scale(.6)}60%,100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){.stamp .qs{animation:none;transform:scale(1)}}
.stage.knk{animation:knk .22s steps(4)}@keyframes knk{25%{transform:translate(3px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,1px)}}
@keyframes thump{from{transform:translate(-50%,-50%) rotate(-7deg) scale(2.2);opacity:0}}
.next{position:absolute;left:50%;bottom:14px;z-index:3;transform:translateX(-50%);width:min(82%,320px)}
.next.btn:active{transform:translateX(-50%) translateY(2px)}
.osd{position:absolute;top:12px;left:14px;z-index:2;font-family:var(--f-px);font-weight:700;font-size:12px;color:#eef3ea;text-shadow:1px 1px 0 #000;display:flex;align-items:center;gap:6px;pointer-events:none}
.osd .rec{display:inline-block;width:8px;height:8px;background:var(--red);animation:blink 1s steps(1) infinite}
.osd .bm{width:7px;height:7px}
@keyframes blink{50%{opacity:0}}

/* Cue + cards */
.tray{flex:none;display:flex;flex-direction:column;gap:12px}
.cue{display:flex;align-items:center;gap:8px;min-height:36px}
.cue-art{display:flex;align-items:center;gap:6px;color:var(--cream)}
.cue-art .heart{color:var(--pink)}
.cue-art .q{color:var(--amber)}
.cue-art canvas{width:36px;height:36px;background:#c7d0d6}
.cue-t{font-size:24px;font-weight:700;color:var(--amber);line-height:1.2;text-wrap:balance;min-width:0}
.cue-t.long{font-size:12px}
.cue{background:var(--panel);padding:8px 10px;margin:3px;box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber)}
.replay{gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:3px}
.card{position:relative;aspect-ratio:4/3;border:0;padding:0;background:#c7d0d6;cursor:pointer;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.card.ph{background:var(--panel);cursor:default}
.card.ph::after{content:"?";font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--line)}
.card.deal{animation:deal .3s steps(4) both}
@keyframes deal{from{opacity:0;transform:translateY(8px)}}
.card.busy{pointer-events:none}
.card.picked{box-shadow:0 -4px 0 0 var(--amber),0 4px 0 0 var(--amber),-4px 0 0 0 var(--amber),4px 0 0 0 var(--amber)}
.grid.deck{grid-template-rows:auto auto}.grid.deck .card{grid-column:1/3;grid-row:1;aspect-ratio:16/9;transition:transform .15s steps(3)}
.grid.deck .card.dk0{z-index:3}.grid.deck .card.dk1{z-index:2;transform:translate(6px,6px);filter:brightness(.55);pointer-events:none}.grid.deck .card.dk2{z-index:1;transform:translate(12px,12px);filter:brightness(.35);pointer-events:none}.grid.deck .card.dkx{visibility:hidden}
.grid.deck .card.toss{z-index:4;visibility:visible;transform:translate(-120%,-10px) rotate(-14deg);opacity:0;transition:transform .18s steps(3),opacity .18s steps(3)}
.grid.deck .dkb{grid-column:1/3;grid-row:2;display:flex;gap:14px;margin-top:8px}.dkb .btn{flex:1;min-height:56px}.dkb .btn .bm{width:22px;height:20px}.dkb .dkn{background:var(--red)}.dkb .dky{background:var(--green)}
.card canvas{grid-area:1/1}.card .who{pointer-events:none}
.card.flee .who{animation:flee 2.4s steps(24) .5s both}
@keyframes flee{0%,8%{transform:none}10%,18%{transform:translateX(-3px)}20%,28%{transform:translateX(3px)}30%,38%{transform:translateX(-3px)}40%,52%{transform:translateX(2px)}58%{transform:translate(4px,-3px)}100%{transform:translate(-150%,-3px)}}
.card .sweat{position:absolute;left:var(--sx,58%);top:var(--sy,16%);width:4px;height:6px;background:#7ac8ff;box-shadow:-14px 6px 0 #7ac8ff,0 0 0 2px #2a4a8a,-14px 6px 0 2px #2a4a8a;opacity:0;pointer-events:none}
.card.flee .sweat{animation:sweat .5s steps(4) .9s 3 both}
@keyframes sweat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(10px)}}
.card .puff{position:absolute;left:12%;bottom:14%;width:8px;height:8px;background:#e8e1cc;box-shadow:8px -4px 0 #e8e1cc,16px 2px 0 #d8d0bc;opacity:0;pointer-events:none}
.card.flee .puff{animation:puff .6s steps(3) 1.9s both}
@keyframes puff{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateX(-12px) scale(1.6)}}
.card.protest .who{animation:stomp .3s steps(2) .45s 5 both}
@keyframes stomp{50%{transform:translateY(-5px)}}
.card .sign{position:absolute;left:var(--cx,50%);top:max(3px,calc(var(--head,30%) - 30px));transform:translate(-50%,0) scale(0);max-width:88%;padding:4px 6px;background:#fff;color:var(--ink);font:700 12px/1.15 var(--f-px);text-align:center;box-shadow:0 0 0 2px var(--ink);pointer-events:none;white-space:normal;overflow-wrap:anywhere;width:max-content}
.card .sign.say::after{content:"";position:absolute;left:30%;top:100%;width:5px;height:5px;background:#fff;box-shadow:2px 2px 0 0 var(--ink),0 2px 0 0 var(--ink),2px 0 0 0 var(--ink)}
.card .sign.top,.card .sign.chest{background:#f4e8cb}
.card .sign.top::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;margin-left:-1px;background:#8a5a33}
.card .sign.chest{top:var(--chest,45%)}
.card .sign.chest::before,.card .sign.chest::after{content:"";position:absolute;top:calc(50% - 3px);width:5px;height:5px;background:var(--skin,#f2c9a2);box-shadow:0 0 0 1px var(--ink)}
.card .sign.chest::before{left:-4px}.card .sign.chest::after{right:-4px}
.card .sign .drop{display:block;width:6px;height:9px;margin:0 2px;background:#7ac8ff;box-shadow:0 0 0 1px #2a4a8a;clip-path:polygon(50% 0,100% 60%,100% 100%,0 100%,0 60%)}
.card .sign.bubs{background:none;box-shadow:none;padding:0;width:18px;height:30px;left:var(--lx,30%);top:calc(var(--head,30%) - 6px)}
.card .sign.bubs i{position:absolute;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:0 0 0 1px #2a6a9a;opacity:0}
.card .sign.bubs i:nth-child(1){width:6px;height:6px;left:2px;bottom:0}.card .sign.bubs i:nth-child(2){width:8px;height:8px;left:8px;bottom:8px}.card .sign.bubs i:nth-child(3){width:5px;height:5px;left:3px;bottom:20px}
.card.protest .sign.bubs{transform:translate(-50%,0)}
.card.protest .sign.bubs i{animation:bub 1.2s steps(6) infinite}.card.protest .sign.bubs i:nth-child(2){animation-delay:.3s}.card.protest .sign.bubs i:nth-child(3){animation-delay:.6s}
@keyframes bub{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.card.protest .sign{animation:signUp .3s steps(3) .4s both}
.card.protest .sign.top,.card.protest .sign.chest{animation:signUp .3s steps(3) .4s both,signWave .5s steps(2) .7s 4}
@keyframes signUp{from{transform:translate(-50%,16px) scale(0)}to{transform:translate(-50%,0) scale(1)}}
@keyframes signWave{50%{transform:translate(-50%,-3px) rotate(-6deg)}}

.card.good{box-shadow:0 -4px 0 0 var(--green),0 4px 0 0 var(--green),-4px 0 0 0 var(--green),4px 0 0 0 var(--green)}
.card.bad{box-shadow:0 -4px 0 0 var(--red),0 4px 0 0 var(--red),-4px 0 0 0 var(--red),4px 0 0 0 var(--red)}
.card.dim{opacity:.3}
.card .mark{position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
.card.good .mark{background:var(--green)}.card.bad .mark{background:var(--red)}
.card .mark .bm{width:14px;height:12px}

.btn{border:0;cursor:pointer;font-family:var(--f-px);font-weight:700;font-size:12px;line-height:1;padding:12px 14px;color:var(--ink);background:var(--amber);display:inline-flex;align-items:center;gap:8px;justify-content:center;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 #b9781d}
.btn:active{transform:translateY(2px)}
.btn .bm{width:10px;height:10px}
.btn.ghost{background:var(--panel);color:var(--cream);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.btn.small{padding:8px 10px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.card:focus-visible,.icon:focus-visible,.dnode:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.ml{margin-left:auto}

/* Title */
.intro{flex:none;display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:4px 3px 0}
.t1{margin:0;font-family:var(--f-px);font-weight:700;font-weight:700;font-size:36px;line-height:1.15;color:var(--amber);text-shadow:3px 3px 0 #7a2e1d}

.tag{margin:0;font-size:12px;color:var(--muted)}
.row{display:flex;gap:14px;align-items:center;width:100%;flex-wrap:wrap}

/* Casebook map */
.mapscr{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:12px}
.maphead{display:flex;align-items:center;gap:10px;flex:none;min-height:36px}.mh-sp{flex:1;min-width:0}.colbtn{min-width:0;max-width:52vw}.colbtn .cl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.colbtn .ci{flex:none}
.maphead h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;flex:1;font-family:var(--f-px);font-weight:700;font-weight:700;font-size:12px;color:var(--amber)}
.tot{display:flex;align-items:center;gap:6px;font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber)}
.tot .bm{width:14px;height:14px}

  background:radial-gradient(circle,rgba(141,134,166,.14) 1px,transparent 1.5px) 0 0/12px 12px}

.link.lit{background:repeating-linear-gradient(var(--amber) 0 4px,transparent 4px 8px)}
.dnode{flex:none;width:min(260px,82%);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:0;cursor:pointer;
  background:var(--panel);color:var(--cream);text-align:left;font:inherit;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.dnode.zl{transform:translateX(-14%)}.dnode.zr{transform:translateX(14%)}
.dnode .num{font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);min-width:30px;text-align:center}

.dnode .stars{display:flex;gap:3px}
.dnode .stars span{color:var(--line)}
.dnode .stars .bm{width:14px;height:14px}
.dnode .stars .on{color:var(--amber)}
.dnode.cur{box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber)}
.dnode.cur .num{animation:blink 1.2s steps(1) infinite}
.dnode.locked{opacity:.4;cursor:default}
.dnode.locked .num .bm{width:15px;height:18px;margin:0 auto;color:var(--muted)}

/* Day result */
.over{flex:none;display:flex;flex-direction:column;gap:16px;align-items:center;padding:4px 3px 0;text-align:center}
.eyebrow{margin:0;font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--muted)}
.rank{margin:0;font-family:var(--f-px);font-weight:700;font-weight:700;font-size:24px;color:var(--amber);text-shadow:3px 3px 0 #7a2e1d}
.rank.fail{color:var(--red)}
.bigstars{display:flex;gap:14px}
.bigstars span{width:44px;height:44px;color:var(--line)}
.bigstars span .bm{width:100%;height:100%}
.bigstars span.on{color:var(--amber);animation:pop .35s steps(3) both}
@keyframes pop{from{transform:scale(2);opacity:0}}
.over .row{justify-content:center}

/* items, energy, sheet, modals, chests */
.items{position:absolute;left:12px;bottom:14px;z-index:3;display:flex;gap:14px}
.item{position:relative;width:46px;height:46px;border:0;padding:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber)}
.item .bm{width:28px;height:22px}
.item b{position:absolute;right:-8px;bottom:-8px;min-width:18px;height:18px;padding:0 4px;background:var(--amber);color:var(--ink);font:700 12px var(--f-px);display:grid;place-items:center}
.item:disabled{opacity:.35;cursor:default}
.card.out{opacity:.22;pointer-events:none}
.rew{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:80px;height:70px;color:#fff;animation:blink .4s steps(1) infinite;filter:drop-shadow(4px 4px 0 #000)}
.rew .bm{width:100%;height:100%}
.epill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);padding:3px 3px 3px 8px;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.epill .bolt{display:block;width:10px;height:14px;color:var(--amber)}
.epill b{font:700 12px var(--f-px);min-width:18px}
.epill small{font:700 12px var(--f-px);color:var(--muted)}
.eplus .bm{width:12px;height:12px;display:block}.eplus{width:24px;height:24px;border:0;padding:0;background:var(--amber);color:var(--ink);font:700 12px var(--f-px);cursor:pointer;display:grid;place-items:center}
.cost{display:inline-flex;align-items:center;gap:3px}.cost .bm{width:8px;height:11px}
.sheet{flex:none;display:flex;align-items:center;gap:12px;background:var(--panel);padding:12px 14px;margin:3px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber)}
.sheet .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.sheet .info b{font:700 12px var(--f-px);color:var(--amber)}
.sheet .info .sub{font-size:12px;color:var(--muted)}
.sheet .stars{display:flex;gap:3px}.sheet .stars span{color:var(--line)}.sheet .stars .bm{width:14px;height:14px}.sheet .stars .on{color:var(--amber)}
.dnode.sel{box-shadow:0 -3px 0 0 var(--cream),0 3px 0 0 var(--cream),-3px 0 0 0 var(--cream),3px 0 0 0 var(--cream)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,6,14,.8);display:grid;place-items:center;padding:16px}
.mbox{position:relative;width:min(300px,100%);background:var(--panel);padding:26px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:0 -4px 0 0 var(--amber),0 4px 0 0 var(--amber),-4px 0 0 0 var(--amber),4px 0 0 0 var(--amber)}
.mbox .big{display:block;width:64px;height:56px}
.mbox .num{font:700 24px var(--f-px);color:var(--amber);display:flex;align-items:center;gap:10px}
