/* Layout: phone column — title / casebook map / day play (HUD, pixel stage at 3x, cue row, 2x2 cards) / day result. Single deliberate noir look. */
:root{
  --bg:#15121f; --panel:#211c31; --line:#3b3454; --ink:#0d0b14;
  --cream:#f4e8cb; --amber:#f2b33d; --red:#e04a4a; --green:#5cc46c; --muted:#8d86a6; --pink:#ff5a7a;
  --f-px:"DBTD Pixel",ui-monospace,monospace;
  --f-sm:"DBTD Pixel",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-size:12px;line-height:1.34;-webkit-font-smoothing:none;font-smooth:never;background:var(--bg);color:var(--cream);font-family:var(--f-sm);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bm{display:block;shape-rendering:crispEdges}
.pxb{box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:10px;height:32px}
.day{font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;background:var(--line)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--amber);animation:blink 1s steps(1) infinite}
.lives{display:flex;gap:5px;color:var(--pink)}
.lives .bm{width:16px;height:14px}
.lives .off{color:var(--line)}
.spacer{flex:1}
.icon{width:32px;height:30px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.icon .bm{width:16px;height:14px}
.lang{font-family:var(--f-px);font-weight:700;font-size:12px;width:auto;padding:0 8px}
.cjk .t1{letter-spacing:.04em}

/* Stage */
.stage{position:relative;flex:1 1 0;min-height:230px;background:var(--ink);display:grid;place-items:center;overflow:hidden;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#cv{transition:opacity .22s steps(4)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);background:var(--ink);padding:12px 16px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber);white-space:nowrap;letter-spacing:.06em;z-index:3}
.banner.boss{color:var(--red);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red);animation:shake .4s steps(4) 2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
.stamp{position:absolute;left:50%;top:40%;z-index:3;font-family:var(--f-px);font-weight:700;font-size:24px;line-height:1;padding:16px 20px;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-7deg);color:var(--green);background:rgba(13,11,20,.82);
  box-shadow:0 -5px 0 0 currentColor,0 5px 0 0 currentColor,-5px 0 0 0 currentColor,5px 0 0 0 currentColor;animation:thump .3s steps(3) both;text-shadow:3px 3px 0 #000}
.stool{position:absolute;left:50%;top:40%;z-index:4;width:108px;height:99px;color:var(--green);pointer-events:none;animation:stampTool 1.15s steps(10) both;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.45))}
.stool svg{display:block;width:100%;height:100%}
.stool.miss{color:var(--red)}
@keyframes stampTool{0%{transform:translate(-50%,-260%) scale(1.3)}30%{transform:translate(-50%,-78%) scale(1)}42%{transform:translate(-50%,-72%) scale(.94,.9)}62%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(70%,-330%) rotate(14deg);opacity:0}}
.stamp.miss{color:var(--red)}
.stamp{pointer-events:none}
.stage.knk{animation:knk .22s steps(4)}@keyframes knk{25%{transform:translate(3px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,1px)}}
@keyframes thump{from{transform:translate(-50%,-50%) rotate(-7deg) scale(2.2);opacity:0}}
.next{position:absolute;left:50%;bottom:14px;z-index:3;transform:translateX(-50%);width:min(82%,320px)}
.next.btn:active{transform:translateX(-50%) translateY(2px)}
.osd{position:absolute;top:12px;left:14px;z-index:2;font-family:var(--f-px);font-weight:700;font-size:12px;color:#eef3ea;text-shadow:1px 1px 0 #000;display:flex;align-items:center;gap:6px;pointer-events:none}
.osd .rec{display:inline-block;width:8px;height:8px;background:var(--red);animation:blink 1s steps(1) infinite}
.osd .bm{width:7px;height:7px}
@keyframes blink{50%{opacity:0}}

/* Cue + cards */
.tray{flex:none;display:flex;flex-direction:column;gap:12px}
.cue{display:flex;align-items:center;gap:8px;min-height:36px}
.cue-art{display:flex;align-items:center;gap:6px;color:var(--cream)}
.cue-art .heart{color:var(--pink)}
.cue-art .q{color:var(--amber)}
.cue-art canvas{width:36px;height:36px;background:#c7d0d6}
.cue-t{font-size:24px;font-weight:700;color:var(--amber);line-height:1.2;text-wrap:balance;min-width:0}
.cue-t.long{font-size:12px}
.cue{background:var(--panel);padding:8px 10px;margin:3px;box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber)}
.replay{gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:3px}
.card{position:relative;aspect-ratio:4/3;border:0;padding:0;background:#c7d0d6;cursor:pointer;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.card.ph{background:var(--panel);cursor:default}

.card.deal{animation:deal .3s steps(4) both}
@keyframes deal{from{opacity:0;transform:translateY(8px)}}
.card.busy{pointer-events:none}
.card canvas{grid-area:1/1}.card .who{pointer-events:none}
.card.flee .who{animation:flee 2.4s steps(24) .5s both}
@keyframes flee{0%,8%{transform:none}10%,18%{transform:translateX(-3px)}20%,28%{transform:translateX(3px)}30%,38%{transform:translateX(-3px)}40%,52%{transform:translateX(2px)}58%{transform:translate(4px,-3px)}100%{transform:translate(-150%,-3px)}}
.card .sweat{position:absolute;left:var(--sx,58%);top:var(--sy,16%);width:4px;height:6px;background:#7ac8ff;box-shadow:-14px 6px 0 #7ac8ff,0 0 0 2px #2a4a8a,-14px 6px 0 2px #2a4a8a;opacity:0;pointer-events:none}
.card.flee .sweat{animation:sweat .5s steps(4) .9s 3 both}
@keyframes sweat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(10px)}}
.card .puff{position:absolute;left:12%;bottom:14%;width:8px;height:8px;background:#e8e1cc;box-shadow:8px -4px 0 #e8e1cc,16px 2px 0 #d8d0bc;opacity:0;pointer-events:none}
.card.flee .puff{animation:puff .6s steps(3) 1.9s both}
@keyframes puff{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateX(-12px) scale(1.6)}}
.card.protest .who{animation:stomp .3s steps(2) .45s 5 both}
@keyframes stomp{50%{transform:translateY(-5px)}}
.card .sign{position:absolute;left:var(--cx,50%);top:max(3px,calc(var(--head,30%) - 30px));transform:translate(-50%,0) scale(0);max-width:88%;padding:4px 6px;background:#fff;color:var(--ink);font:700 12px/1.15 var(--f-px);text-align:center;box-shadow:0 0 0 2px var(--ink);pointer-events:none;white-space:normal;overflow-wrap:anywhere;width:max-content}
.card .sign.say::after{content:"";position:absolute;left:30%;top:100%;width:5px;height:5px;background:#fff;box-shadow:2px 2px 0 0 var(--ink),0 2px 0 0 var(--ink),2px 0 0 0 var(--ink)}
.card .sign.top,.card .sign.chest{background:#f4e8cb}
.card .sign.top::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;margin-left:-1px;background:#8a5a33}
.card .sign.chest{top:var(--chest,45%)}
.card .sign.chest::before,.card .sign.chest::after{content:"";position:absolute;top:calc(50% - 3px);width:5px;height:5px;background:var(--skin,#f2c9a2);box-shadow:0 0 0 1px var(--ink)}
.card .sign.chest::before{left:-4px}.card .sign.chest::after{right:-4px}
.card .sign .drop{display:block;width:6px;height:9px;margin:0 2px;background:#7ac8ff;box-shadow:0 0 0 1px #2a4a8a;clip-path:polygon(50% 0,100% 60%,100% 100%,0 100%,0 60%)}
.card .sign.bubs{background:none;box-shadow:none;padding:0;width:18px;height:30px;left:var(--lx,30%);top:calc(var(--head,30%) - 6px)}
.card .sign.bubs i{position:absolute;border:2px solid #fff;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:0 0 0 1px #2a6a9a;opacity:0}
.card .sign.bubs i:nth-child(1){width:6px;height:6px;left:2px;bottom:0}.card .sign.bubs i:nth-child(2){width:8px;height:8px;left:8px;bottom:8px}.card .sign.bubs i:nth-child(3){width:5px;height:5px;left:3px;bottom:20px}
.card.protest .sign.bubs{transform:translate(-50%,0)}
.card.protest .sign.bubs i{animation:bub 1.2s steps(6) infinite}.card.protest .sign.bubs i:nth-child(2){animation-delay:.3s}.card.protest .sign.bubs i:nth-child(3){animation-delay:.6s}
@keyframes bub{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.card.protest .sign{animation:signUp .3s steps(3) .4s both}
.card.protest .sign.top,.card.protest .sign.chest{animation:signUp .3s steps(3) .4s both,signWave .5s steps(2) .7s 4}

@keyframes signWave{50%{transform:translate(-50%,-3px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.card.flee .who,.card.flee .sweat,.card.flee .puff,.card.protest .who,.card.protest .sign{animation:none}.card.protest .sign{transform:translate(-50%,0)}}

/* Title */
.intro{flex:none;display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:4px 3px 0}

.row{display:flex;gap:14px;align-items:center;width:100%;flex-wrap:wrap}

.maphead{display:flex;align-items:center;gap:10px;flex:none;min-height:36px}.mh-sp{flex:1;min-width:0}.colbtn{min-width:0;max-width:52vw}.colbtn .cl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.colbtn .ci{flex:none}

/* Day result */

const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function prepChg(h){const f=h.chg,bg=bgFor(h.env,false),g=bg.getContext('2d');h.pw=W;h.ph=H;let[x,y,w,ht]=f.rg(W,H,GY).map(Math.round);x=Math.max(0,x);y=Math.max(0,y);w=Math.max(1,Math.min(w,W-x));ht=Math.max(1,Math.min(ht,H-y));
  if(f.pick){const d=g.getImageData(0,0,W,H).data,[pr,pg,pb]=hexRGB(f.pick),is=(X,Y)=>{if(X<0||Y<0)return false;const k=(Y*W+X)*4;return d[k]===pr&&d[k+1]===pg&&d[k+2]===pb},c=[];for(let j=y;j<y+ht;j++)for(let i=x;i<x+w;i++)if(is(i,j)&&!is(i-1,j)&&!is(i,j-1)&&!is(i+1,j-1)&&!is(i-1,j-1))c.push([i,j])
    const mid=c.filter(([cx])=>cx<W*.34||cx>W*.66),pool=mid.length?mid:c;if(!pool.length){h.bad=true;return}if(h.pk==null)h.pk=Math.floor(Math.random()*pool.length);const[px,py]=pool[h.pk%pool.length],o=f.off||[0,0];x=Math.max(0,px+o[0]);y=Math.max(0,py+o[1]);w=f.blk[0];ht=f.blk[1]}
  const pc=mk(w,ht),pg2=pc.getContext('2d');if(f.draw){const r=R(pg2);pg2.translate(-x,-y);f.draw(r,W,H,GY);pg2.setTransform(1,0,0,1,0,0)}
  else{pg2.drawImage(bg,x,y,w,ht,0,0,w,ht);const im=pg2.getImageData(0,0,w,ht),d=im.data,M=Object.entries(f.map).map(([a,b])=>[hexRGB(a),hexRGB(b)]);
    for(let k=0;k<d.length;k+=4){if(f.circ){const i=(k>>2)%w,j=(k>>2)/w|0,dx=i-(w-1)/2,dy=j-(ht-1)/2;if(dx*dx+dy*dy>(w/2)*(w/2)){d[k+3]=0;continue}}for(const[[a1,a2,a3],[b1,b2,b3]]of M)if(d[k]===a1&&d[k+1]===a2&&d[k+2]===a3){d[k]=b1;d[k+1]=b2;d[k+2]=b3;break}}pg2.putImageData(im,0,0)}
  h.patch=pc;h.box=[x,y,w,ht]}
function chgHit(h,x,y){const[bx,by,bw,bh]=h.box,cx=bx+bw/2,cy=by+bh/2,hw=Math.max(7,bw/2+3),hh=Math.max(7,bh/2+3);return Math.abs(x-cx)<=hw&&Math.abs(y-cy)<=hh}
function hidPos(h){return[Math.round(W*h.it.spx),GY+h.it.spy]}
function maybeHid(cs){S.hid=null;if(!S.col.size||S.mode!=='play'||S.top||!SPOT[cs.env])return;const cand=COL.filter(it=>it.src[0]==='H'&&it.env===cs.env&&!owned(it.id));if(!cand.length)return;
  const x=Math.random();let r=x<.01?3:x<.04?2:x<.11?1:x<.26?0:-1;if(r<0)return;
  let pool=[];for(;r>=0&&!pool.length;r--)pool=cand.filter(c=>c.r===r);if(!pool.length)return;const it=pick(pool);S.hid={it,env:it.env,cont:it.cont,open:false};if(it.r>=1&&CHG[it.env]){let fs=[];for(let q=it.r;q>=1&&!fs.length;q--)fs=CHG[it.env].filter(f=>f.r===q);if(fs.length){const h=S.hid;h.chg=pick(fs);prepChg(h);if(h.bad)S.hid=null}}}
function drawHid(t){const h=S.hid;if(!h)return;if(h.chg){if(h.pw!==W||h.ph!==H)prepChg(h);if(h.bad)return;if(!h.open)sctx.drawImage(h.patch,h.box[0],h.box[1]);else{const e=gnow()-h.ot;if(e<700){const[bx,by,bw,bh]=h.box,cx=bx+bw/2,cy=by+bh/2,r=3+e/50;sctx.fillStyle='#fff1b8';for(let i=0;i<8;i++){const a=i*Math.PI/4;sctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)}}}return}const[x,y]=hidPos(h);drawCont(R(sctx),h.cont,x,y,h.open,t)}
stage.addEventListener('pointerdown',e=>{const h=S.hid;if(!h||h.open||S.phase!=='reveal'||S.mode!=='play')return;const r=cv.getBoundingClientRect();if(!r.width)return;
