/* Layout: phone column — title / casebook map / day play (HUD, pixel stage at 3x, cue row, 2x2 cards) / day result. Single deliberate noir look. */
:root{
  --bg:#15121f; --panel:#211c31; --line:#3b3454; --ink:#0d0b14;
  --cream:#f4e8cb; --amber:#f2b33d; --red:#e04a4a; --green:#5cc46c; --muted:#8d86a6; --pink:#ff5a7a;
  --f-px:"DBTD Pixel",ui-monospace,monospace;
  --f-sm:"DBTD Pixel",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-size:12px;line-height:1.34;-webkit-font-smoothing:none;font-smooth:never;background:var(--bg);color:var(--cream);font-family:var(--f-sm);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bm{display:block;shape-rendering:crispEdges}
.pxb{box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:10px;height:32px}
.day{font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;background:var(--line)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--amber);animation:blink 1s steps(1) infinite}
.lives{display:flex;gap:5px;color:var(--pink)}
.lives .bm{width:16px;height:14px}
.lives .off{color:var(--line)}
.spacer{flex:1}
.icon{width:32px;height:30px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.icon .bm{width:16px;height:14px}
.lang{font-family:var(--f-px);font-weight:700;font-size:12px;width:auto;padding:0 8px}
.cjk .t1{letter-spacing:.04em}

/* Stage */
.stage{position:relative;flex:1 1 0;min-height:230px;background:var(--ink);display:grid;place-items:center;overflow:hidden;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#cv{transition:opacity .22s steps(4)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);background:var(--ink);padding:12px 16px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber);white-space:nowrap;letter-spacing:.06em;z-index:3}
.banner.boss{color:var(--red);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red);animation:shake .4s steps(4) 2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
.stamp{position:absolute;left:50%;top:40%;z-index:3;font-family:var(--f-px);font-weight:700;font-size:36px;line-height:1;padding:20px 26px;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-7deg);color:var(--green);background:rgba(13,11,20,.82);
  box-shadow:0 -6px 0 0 currentColor,0 6px 0 0 currentColor,-6px 0 0 0 currentColor,6px 0 0 0 currentColor;animation:thump .3s steps(3) both;text-shadow:3px 3px 0 #000}
.stamp.sm{font-size:24px;padding:16px 20px}
.stool{position:absolute;left:50%;top:40%;z-index:4;width:108px;height:99px;color:var(--green);pointer-events:none;animation:stampTool 1.15s steps(10) both;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.45))}
.stool svg{display:block;width:100%;height:100%}
.stool.miss{color:var(--red)}
@keyframes stampTool{0%{transform:translate(-50%,-260%) scale(1.3)}30%{transform:translate(-50%,-78%) scale(1)}42%{transform:translate(-50%,-72%) scale(.94,.9)}62%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(70%,-330%) rotate(14deg);opacity:0}}
.stamp.miss{color:var(--red)}
.stamp{pointer-events:none}
.stamp .qb .bm{display:inline-block;width:1em;height:1em;vertical-align:-3px;margin-right:6px;color:#ffd65a}

const FEST=(()=>{const d=new Date(),m=d.getMonth()+1,day=d.getDate(),y=d.getFullYear();if((m===10&&day>=24)||(m===11&&day<=1))return'halloween';if(m===12&&day>=18&&day<=26)return'xmas';if(m===2&&day>=12&&day<=15)return'valentine';
  const cny={2026:[2,17],2027:[2,6],2028:[1,26],2029:[2,13],2030:[2,3],2031:[1,23]}[y];if(cny){const diff=(d-new Date(y,cny[0]-1,cny[1]))/864e5;if(diff>=-3&&diff<=8)return'cny'}return''})();
const AMB={park:['birds','balloon','squirrel'],street:['plane','balloon','paper'],hallway:['mouse'],bedroom:['moth'],bar:['mouse','sparkle'],storm:['bolt'],sea:['jelly','turtle']};
const AMB_NO=['animals','bird','count','fish','cat'];
function pickDeco(cs){const d={tod:'day',season:'',amb:null,at0:0};
  if(cs.env==='park')d.tod=wpick([['day',45],['dawn',15],['dusk',20],['night',20]]);
  if(cs.env==='park'||cs.env==='street')d.season=wpick([['',45],['autumn',20],['winter',18],['spring',17]]);
  if(AMB[cs.env]&&!AMB_NO.includes(cs.type)&&Math.random()<.35)d.amb=pick(AMB[cs.env]);return d}
function drawBack(t,g){const d=S.deco;if(!d||(S.cs&&S.cs.calm))return;const R_=R(sctx);
  if(d.season==='winter'){R_.r(0,GY,W,2,'#eef4ff');for(let x=3;x<W;x+=11)R_.e(x,GY,3,1,'#f8fbff')}
  if(d.season==='autumn')for(let i=0;i<W/5;i++){const x=(i*37)%W,c=['#d8662b','#e8a030','#b8402a'][i%3];R_.r(x,GY+1+(i%3),2,1,c)}
  if(FEST==='halloween'&&!S.top){for(const x of[Math.round(W*.06),Math.round(W*.94)]){R_.e(x,GY-3,4,3,'#f08a2e');R_.r(x-1,GY-7,2,2,'#3e8a3a');R_.px(x-2,GY-4,'#ffe27a');R_.px(x+1,GY-4,'#ffe27a');R_.r(x-2,GY-2,4,1,'#ffe27a')}}
  if(FEST==='cny'&&!S.top)for(const x of[Math.round(W*.15),Math.round(W*.85)]){R_.r(x,0,1,6,'#3a2414');R_.e(x,10,4,4,'#e0302a');R_.r(x-3,9,7,1,'#f2c443');R_.r(x,14,1,3,'#f2c443')}
  if(d.amb&&S.anim&&S.anim.type==='pass'){const p=(g-d.at0)/2600;if(p>=0&&p<=1)drawAmb(R_,d.amb,p,t)}}
function drawAmb(R_,a,p,t){const fl=Math.floor(t/160)&1;
  if(a==='birds'){for(let i=0;i<3;i++){const x=Math.round(-12+(W+24)*p-i*6),y=GY-64+i*3;R_.px(x,y,'#2a2630');R_.px(x+1,y+(fl?-1:1),'#2a2630');R_.px(x-1,y+(fl?-1:1),'#2a2630')}}
  else if(a==='balloon'){const x=Math.round(W*.3+Math.sin(p*9)*2),y=Math.round(GY-6-p*(GY+20));R_.d(x,y,3,'#e0302a');R_.px(x-1,y-1,'#ff8a8a');R_.r(x,y+4,1,5,'#f4e8cb')}
  else if(a==='squirrel'){const x=Math.round(W+6-(W+12)*p);R_.r(x,GY-3,5,3,'#a8603a');R_.r(x+4,GY-6,2,4,'#c8804e');R_.px(x,GY-4,'#a8603a');R_.px(x+(fl?1:3),GY,'#6e3a20')}
  else if(a==='plane'){const x=Math.round(W+4-(W+8)*p);R_.r(x,5,5,1,'#8d8a96');R_.px(x+2,4,'#8d8a96');if(fl)R_.px(x+4,5,'#ff5a5a')}
  else if(a==='paper'){const x=Math.round(-6+(W+12)*p),y=Math.round(GY-8-Math.abs(Math.sin(p*7))*14);R_.r(x,y,4,3,'#e8e1cc');R_.r(x+1,y+1,2,1,'#8d8a96')}
  else if(a==='mouse'){const x=Math.round(-4+(W+8)*p);R_.r(x,GY,3,2,'#8d8a96');R_.px(x+3,GY,'#8d8a96');R_.px(x-1,GY+1,'#5a5560');R_.px(x+2,GY-1,'#f0a0b0')}
  else if(a==='moth'){const cx=Math.round(W*.82),x=Math.round(cx+Math.cos(p*20)*7),y=Math.round(GY-34+Math.sin(p*27)*4);R_.px(x,y,'#e8dcc4');R_.px(x+(fl?1:-1),y-1,'#e8dcc4')}
  else if(a==='sparkle'){for(let i=0;i<6;i++){const x=(i*29+Math.floor(p*40)*13)%W,y=(i*17+Math.floor(p*40)*7)%Math.max(1,GY-20);R_.px(x,y,['#ff9fd0','#9fe8ff','#f2c443'][i%3])}}
  else if(a==='bolt'){if(p>.4&&p<.5){let x=Math.round(W*.72),y=0;sctx.fillStyle='#fffbe0';while(y<GY-20){const nx=x+Math.round((Math.random()-.5)*6);R_.line(x,y,nx,y+5,'#fffbe0');x=nx;y+=5}}}
  else if(a==='jelly'){const x=Math.round(W*.25+Math.sin(p*6)*3),y=Math.round(GY-p*(GY+10));R_.e(x,y,3,2,'rgba(255,170,220,.85)');for(const dx of[-2,0,2])R_.r(x+dx,y+2,1,3+(fl&&dx===0?1:0),'rgba(255,190,230,.7)')}
  else if(a==='turtle'){const x=Math.round(W+6-(W+12)*p),y=GY-70;R_.e(x,y,4,2,'#3f8f5a');R_.px(x-5,y,'#7ac08a');R_.px(x-3,y+(fl?2:1),'#7ac08a');R_.px(x+3,y+(fl?1:2),'#7ac08a')}}
function drawFront(t,g){const d=S.deco;if(!d||(S.cs&&S.cs.calm))return;
  if(d.tod!=='day'){sctx.globalCompositeOperation='multiply';sctx.fillStyle={dawn:'#ffd8cc',dusk:'#ffc49a',night:'#4a5a9a'}[d.tod];sctx.fillRect(0,0,W,H);sctx.globalCompositeOperation='lighter';if(d.tod==='dusk'){sctx.fillStyle='rgba(255,110,50,.16)';sctx.fillRect(0,Math.round(GY*.45),W,Math.round(GY*.55))}
    if(d.tod==='night'){sctx.fillStyle='rgba(255,255,220,.8)';for(let i=0;i<W/6;i++)sctx.fillRect((i*41)%W,(i*23)%Math.max(1,Math.round(GY*.35)),1,1)}else{sctx.fillStyle=d.tod==='dawn'?'rgba(255,150,140,.10)':'rgba(170,90,200,.12)';sctx.fillRect(0,0,W,Math.round(GY*.4))}
    sctx.globalCompositeOperation='source-over'}
  const P=(n,col,sz,spd,sway)=>{sctx.fillStyle=col;for(let i=0;i<n;i++){const y=Math.floor((i*53+t*spd*(1+i%3))%(H+10))-5,x=Math.floor((i*97+Math.sin(t/700+i)*sway+W)%W);sctx.fillRect(x,y,sz,sz)}};
  if(d.season==='autumn'){P(Math.round(W/14),'#e07a2e',2,.012,6);P(Math.round(W/20),'#c84a2a',1,.016,4)}
  else if(d.season==='winter')P(Math.round(W/9),'rgba(255,255,255,.9)',1,.014,3);
  else if(d.season==='spring')P(Math.round(W/12),'#ffb0cc',1,.01,8);
  if(FEST==='xmas'&&!S.top){for(let x=0;x<W;x++){const y=3+Math.round(Math.abs(Math.sin(x/9))*4);sctx.fillStyle='#2f6a3a';sctx.fillRect(x,y,1,1);if(x%6===0){sctx.fillStyle=['#ff4a4a','#f2c443','#5cc4f0','#5cc46c'][(x/6+Math.floor(t/400))%4|0];sctx.fillRect(x,y+1,2,2)}}}
  if(FEST==='valentine')P(6,'#ff5a7a',2,.008,10);
  if(FEST==='halloween'&&!S.top&&!(S.cs&&AMB_NO.includes(S.cs.type))){const p=(t%7000)/7000;if(p<.5){const x=Math.round(-8+(W+16)*p*2),y=Math.round(10+Math.sin(p*30)*4),f=Math.floor(t/120)&1;sctx.fillStyle='#1b1726';sctx.fillRect(x,y,3,2);sctx.fillRect(x-2,y-(f?1:0),2,1);sctx.fillRect(x+3,y-(f?1:0),2,1)}}}
