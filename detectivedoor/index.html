/* Layout: phone column — title / casebook map / day play (HUD, pixel stage at 3x, cue row, 2x2 cards) / day result. Single deliberate noir look. */
:root{
  --bg:#15121f; --panel:#211c31; --line:#3b3454; --ink:#0d0b14;
  --cream:#f4e8cb; --amber:#f2b33d; --red:#e04a4a; --green:#5cc46c; --muted:#8d86a6; --pink:#ff5a7a;
  --f-px:"DBTD Pixel",ui-monospace,monospace;
  --f-sm:"DBTD Pixel",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-size:12px;line-height:1.34;-webkit-font-smoothing:none;font-smooth:never;background:var(--bg);color:var(--cream);font-family:var(--f-sm);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bm{display:block;shape-rendering:crispEdges}
.pxb{box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:10px;height:32px}
.day{font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;background:var(--line)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--amber);animation:blink 1s steps(1) infinite}
.lives{display:flex;gap:5px;color:var(--pink)}
.lives .bm{width:16px;height:14px}
.lives .off{color:var(--line)}
.spacer{flex:1}
.icon{width:32px;height:30px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.icon .bm{width:16px;height:14px}
.lang{font-family:var(--f-px);font-weight:700;font-size:12px;width:auto;padding:0 8px}
.cjk .t1{letter-spacing:.04em}

/* Stage */
.stage{position:relative;flex:1 1 0;min-height:230px;background:var(--ink);display:grid;place-items:center;overflow:hidden;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#cv{transition:opacity .22s steps(4)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);background:var(--ink);padding:12px 16px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber);white-space:nowrap;letter-spacing:.06em;z-index:3}
.banner.boss{color:var(--red);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red);animation:shake .4s steps(4) 2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
.stamp{position:absolute;left:50%;top:40%;z-index:3;font-family:var(--f-px);font-weight:700;font-size:36px;line-height:1;padding:20px 26px;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-7deg);color:var(--green);background:rgba(13,11,20,.82);
  box-shadow:0 -6px 0 0 currentColor,0 6px 0 0 currentColor,-6px 0 0 0 currentColor,6px 0 0 0 currentColor;animation:thump .3s steps(3) both;text-shadow:3px 3px 0 #000}
.stamp.sm{font-size:24px;padding:16px 20px}
.stool{position:absolute;left:50%;top:40%;z-index:4;width:108px;height:99px;color:var(--green);pointer-events:none;animation:stampTool 1.15s steps(10) both;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.45))}
.stool svg{display:block;width:100%;height:100%}
.stool.miss{color:var(--red)}
@keyframes stampTool{0%{transform:translate(-50%,-260%) scale(1.3)}30%{transform:translate(-50%,-78%) scale(1)}42%{transform:translate(-50%,-72%) scale(.94,.9)}62%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(70%,-330%) rotate(14deg);opacity:0}}
.stamp.miss{color:var(--red)}
.stamp{pointer-events:none}
.stamp .qb .bm{display:inline-block;width:1em;height:1em;vertical-align:-3px;margin-right:6px;color:#ffd65a}
.stamp .qs{position:absolute;width:3px;height:3px;background:var(--c,#fff1b8);box-shadow:0 -3px 0 var(--c,#fff1b8),0 3px 0 var(--c,#fff1b8),-3px 0 0 var(--c,#fff1b8),3px 0 0 var(--c,#fff1b8),0 -6px 0 var(--c,#fff1b8),0 6px 0 var(--c,#fff1b8),-6px 0 0 var(--c,#fff1b8),6px 0 0 var(--c,#fff1b8);transform:scale(0);animation:qtw .9s steps(1) infinite}
.stamp .qs.s{box-shadow:0 -3px 0 var(--c,#fff1b8),0 3px 0 var(--c,#fff1b8),-3px 0 0 var(--c,#fff1b8),3px 0 0 var(--c,#fff1b8)}
@keyframes qtw{0%{transform:scale(0)}15%{transform:scale(.6)}30%{transform:scale(1)}45%{transform:scale(.6)}60%,100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){.stamp .qs{animation:none;transform:scale(1)}}
.stage.knk{animation:knk .22s steps(4)}@keyframes knk{25%{transform:translate(3px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,1px)}}

const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function fly(src,dst,icon,n,cls,onEach,onDone){const ih=typeof icon==='string'?icon:bm(icon);const a=rectOf(src),b=rectOf(dst);let left=n;if(!n){onDone&&onDone();return}
  for(let i=0;i<n;i++){const el=document.createElement('span');el.className='fly '+(cls||'');el.innerHTML=ih;document.body.appendChild(el);
    const x0=a.left+a.width/2-7+(Math.random()-.5)*24,y0=a.top+a.height/2-10+(Math.random()-.5)*14,x1=b.left+b.width/2-7,y1=b.top+b.height/2-10;
    el.style.transform=`translate(${x0}px,${y0}px)`;
    setTimeout(()=>{el.style.transform=`translate(${x1}px,${y1}px) scale(.8)`},30+i*80);
    setTimeout(()=>{el.remove();onEach&&onEach(i);if(--left===0)onDone&&onDone()},660+i*80)}}
function gain(n,src){const from=S.eShown??S.energy;S.energy+=n;saveMeta();const p=pill();
  if(!p){renderEnergy();sfx.coin();return}const k=Math.min(n,8);S.eShown=from;renderEnergy();
  fly(src,p.querySelector('.bolt')||p,IC.bolt,k,'',i=>{S.eShown=from+Math.round(n*(i+1)/k);renderEnergy();bump(p,'bump');tone(1100+i*60,.05,'square',.025)},()=>{S.eShown=null;renderEnergy();floatText(p,'+'+n)})}
function spend(n,btn,go){const p=pill();if(S.energy<n){bump(btn,'nope');bump(p,'drain');sfx.bad();setTimeout(openEnergy,380);return false}
  if(S.energy>=EMAX)S.eTick=Date.now();S.energy-=n;saveMeta();renderEnergy();bump(p,'drain');floatText(p,'-'+n,'neg');tone(300,.12,'square',.03,-120);

function confetti(lv=1){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const big=lv>1;
  const cv=document.createElement('canvas'),dpr=1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none';document.body.appendChild(cv);
  const g=cv.getContext('2d');g.scale(dpr,dpr);const cols=['#f2b33d','#5cc46c','#ff5a7a','#3f6fd8','#f4e8cb','#8a4bc9'],P=[];
  const burst=(x,y,dir,n,delay)=>{for(let i=0;i<n;i++){const a=dir?-Math.PI/2+dir*(.25+Math.random()*.55):-Math.PI/2+(Math.random()-.5)*1.4,sp=(14+Math.random()*9)*Math.min(1.25,Math.max(.8,innerHeight/760));
    P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,
      f:Math.random()*6,vf:.12+Math.random()*.2,c:cols[i%cols.length],d:delay+Math.random()*.08,sw:Math.random()*1.5+.5})}};
  burst(0,H*.92,1,big?70:45,0);burst(W,H*.92,-1,big?70:45,0);burst(W*.5,H*.95,0,big?45:28,.35);
  if(big){burst(0,H*.7,1,45,.75);burst(W,H*.7,-1,45,.75);burst(W*.5,H*.95,0,40,1.3);
    for(let i=0;i<45;i++)P.push({x:Math.random()*W,y:-20-Math.random()*60,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,w:7,h:7,r:0,vr:(Math.random()-.5)*.15,f:Math.random()*6,vf:.05,c:i%3?'#f2b33d':'#fff1b8',d:.5+Math.random()*1.6,sw:1,st:1});
    const fl=document.createElement('div');fl.className='scrflash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),600)}
  const t0=performance.now();let last=t0;
  (function step(now){const dt=Math.min(2,(now-last)/16.7),el=(now-t0)/1000;last=now;g.clearRect(0,0,W,H);let alive=0;
    for(const p of P){if(el<p.d){alive++;continue}
      p.vy+=.32*dt;p.vx*=Math.pow(.985,dt);p.vy*=Math.pow(p.vy>0?.96:.985,dt);if(p.vy>2.2)p.vy=2.2;
      p.f+=p.vf*dt;p.x+=(p.vx+Math.sin(p.f)*p.sw)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      if(p.y<H+20){alive++;g.save();g.translate(Math.round(p.x),Math.round(p.y));g.rotate(p.r);g.scale(1,Math.cos(p.f));
        const fe=big?3.6:2.4;g.globalAlpha=el>fe?Math.max(0,1-(el-fe)/.8):1;g.fillStyle=p.c;if(p.st){g.fillRect(-1.5,-5,3,10);g.fillRect(-5,-1.5,10,3)}else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}}
    if(alive&&el<(big?4.4:3.2))requestAnimationFrame(step);else cv.remove()})(t0);
  if(big)[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.4:.12,'square',.035,0,i*.1));else{tone(523,.1,'square',.03);tone(784,.16,'square',.03,0,.08)}}
