/* Layout: phone column — title / casebook map / day play (HUD, pixel stage at 3x, cue row, 2x2 cards) / day result. Single deliberate noir look. */
:root{
  --bg:#15121f; --panel:#211c31; --line:#3b3454; --ink:#0d0b14;
  --cream:#f4e8cb; --amber:#f2b33d; --red:#e04a4a; --green:#5cc46c; --muted:#8d86a6; --pink:#ff5a7a;
  --f-px:"DBTD Pixel",ui-monospace,monospace;
  --f-sm:"DBTD Pixel",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-size:12px;line-height:1.34;-webkit-font-smoothing:none;font-smooth:never;background:var(--bg);color:var(--cream);font-family:var(--f-sm);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bm{display:block;shape-rendering:crispEdges}
.pxb{box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:10px;height:32px}
.day{font-family:var(--f-px);font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:9px;height:9px;background:var(--line)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--amber);animation:blink 1s steps(1) infinite}
.lives{display:flex;gap:5px;color:var(--pink)}
.lives .bm{width:16px;height:14px}
.lives .off{color:var(--line)}
.spacer{flex:1}
.icon{width:32px;height:30px;border:0;background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.icon .bm{width:16px;height:14px}
.lang{font-family:var(--f-px);font-weight:700;font-size:12px;width:auto;padding:0 8px}
.cjk .t1{letter-spacing:.04em}

/* Stage */
.stage{position:relative;flex:1 1 0;min-height:230px;background:var(--ink);display:grid;place-items:center;overflow:hidden;margin:3px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#cv{transition:opacity .22s steps(4)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-px);font-weight:700;font-size:24px;color:var(--amber);background:var(--ink);padding:12px 16px;
  box-shadow:0 -3px 0 0 var(--amber),0 3px 0 0 var(--amber),-3px 0 0 0 var(--amber),3px 0 0 0 var(--amber);white-space:nowrap;letter-spacing:.06em;z-index:3}
.banner.boss{color:var(--red);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red);animation:shake .4s steps(4) 2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
.stamp{position:absolute;left:50%;top:40%;z-index:3;font-family:var(--f-px);font-weight:700;font-size:24px;line-height:1;padding:16px 20px;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-7deg);color:var(--green);background:rgba(13,11,20,.82);
  box-shadow:0 -5px 0 0 currentColor,0 5px 0 0 currentColor,-5px 0 0 0 currentColor,5px 0 0 0 currentColor;animation:thump .3s steps(3) both;text-shadow:3px 3px 0 #000}
.stool{position:absolute;left:50%;top:40%;z-index:4;width:108px;height:99px;color:var(--green);pointer-events:none;animation:stampTool 1.15s steps(10) both;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.45))}
.stool svg{display:block;width:100%;height:100%}
.stool.miss{color:var(--red)}
@keyframes stampTool{0%{transform:translate(-50%,-260%) scale(1.3)}30%{transform:translate(-50%,-78%) scale(1)}42%{transform:translate(-50%,-72%) scale(.94,.9)}62%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(70%,-330%) rotate(14deg);opacity:0}}
.stamp.miss{color:var(--red)}
@keyframes thump{from{transform:translate(-50%,-50%) rotate(-7deg) scale(2.2);opacity:0}}
.next{position:absolute;left:50%;bottom:14px;z-index:3;transform:translateX(-50%);width:min(82%,320px)}
.next.btn:active{transform:translateX(-50%) translateY(2px)}

function saveMeta(){try{localStorage.setItem('dbtd.meta',JSON.stringify({energy:S.energy,eTick:S.eTick,adDay:S.adDay,adCount:S.adCount,items:S.items,chestMask:S.chests,tutDone:S.tutDone,chestItem:S.chestItem||{},ebest:S.ebest||0,eplayed:!!S.eplayed,dly:S.dly||null,chestGold:S.chestGold||{},col:[...S.col],ms:[...S.ms],colNew:[...S.colNew],colIntro:!!S.colIntro,dst:S.dst,dmax:S.dmax||0}));localStorage.setItem('dbtd.stars',JSON.stringify(S.stars))}catch(e){}}
const today=()=>new Date().toDateString();
function dly(){if(!S.dly||S.dly.k!==dKey())S.dly={k:dKey(),stars:0,chests:0,item:null,gold:0};return S.dly}
function adsLeft(){if(S.adDay!==today()){S.adDay=today();S.adCount=0}return AD_MAX-S.adCount}
function regen(){const now=Date.now();if(S.energy>=EMAX){S.eTick=now;return}const n=Math.floor((now-S.eTick)/REGEN);if(n>0){S.energy=Math.min(EMAX,S.energy+n);S.eTick=S.energy>=EMAX?now:S.eTick+n*REGEN;saveMeta()}}
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function renderEnergy(){const tm=S.energy<EMAX?mmss(REGEN-(Date.now()-S.eTick)):'';
  const shown=S.eShown??S.energy;document.querySelectorAll('[data-epill]').forEach(el=>{el.innerHTML=`<span class="bolt">${bm(IC.bolt)}</span><b>${shown}</b>${tm?`<small>${tm}</small>`:''}<button class="eplus" aria-label="Get energy">${bm(IC.plus)}</button>`;el.querySelector('.eplus').onclick=openEnergy});
  const m=$('#mEnergy');if(m)m.innerHTML=bm(IC.bolt)+shown;const mt=$('#mTime');if(mt)mt.textContent=tm}
setInterval(()=>{regen();renderEnergy();if(S.mode==='map'){if(S.mapKey!==dKey())renderMap();else if(S.sel==='D'){const c=$('#shCd');if(c)c.innerHTML=bm(IC.retry)+cdText()}}},1000);
const cdText=()=>{const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);const s=Math.max(0,Math.floor((m-n)/1000));return[s/3600|0,(s/60|0)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};
const bump=(el,c)=>{if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
const pill=()=>[...document.querySelectorAll('[data-epill]')].find(e=>e.offsetParent!==null);
const rectOf=x=>x&&x.getBoundingClientRect?x.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
function floatText(src,txt,cls){const r=rectOf(src),f=document.createElement('span');f.className='float '+(cls||'');f.innerHTML=txt;f.style.left=(r.left+r.width/2-14)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
function fly(src,dst,icon,n,cls,onEach,onDone){const ih=typeof icon==='string'?icon:bm(icon);const a=rectOf(src),b=rectOf(dst);let left=n;if(!n){onDone&&onDone();return}
  for(let i=0;i<n;i++){const el=document.createElement('span');el.className='fly '+(cls||'');el.innerHTML=ih;document.body.appendChild(el);
    const x0=a.left+a.width/2-7+(Math.random()-.5)*24,y0=a.top+a.height/2-10+(Math.random()-.5)*14,x1=b.left+b.width/2-7,y1=b.top+b.height/2-10;
    el.style.transform=`translate(${x0}px,${y0}px)`;
    setTimeout(()=>{el.style.transform=`translate(${x1}px,${y1}px) scale(.8)`},30+i*80);
    setTimeout(()=>{el.remove();onEach&&onEach(i);if(--left===0)onDone&&onDone()},660+i*80)}}
function gain(n,src){const from=S.eShown??S.energy;S.energy+=n;saveMeta();const p=pill();
  if(!p){renderEnergy();sfx.coin();return}const k=Math.min(n,8);S.eShown=from;renderEnergy();
  fly(src,p.querySelector('.bolt')||p,IC.bolt,k,'',i=>{S.eShown=from+Math.round(n*(i+1)/k);renderEnergy();bump(p,'bump');tone(1100+i*60,.05,'square',.025)},()=>{S.eShown=null;renderEnergy();floatText(p,'+'+n)})}
function spend(n,btn,go){const p=pill();if(S.energy<n){bump(btn,'nope');bump(p,'drain');sfx.bad();setTimeout(openEnergy,380);return false}
  if(S.energy>=EMAX)S.eTick=Date.now();S.energy-=n;saveMeta();renderEnergy();bump(p,'drain');floatText(p,'-'+n,'neg');tone(300,.12,'square',.03,-120);
  if(p&&btn)fly(p.querySelector('.bolt')||p,btn,IC.bolt,3,'',null,go);else go();return true}
function confetti(lv=1){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const big=lv>1;
  const cv=document.createElement('canvas'),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none';document.body.appendChild(cv);
  const g=cv.getContext('2d');g.scale(dpr,dpr);const cols=['#f2b33d','#5cc46c','#ff5a7a','#3f6fd8','#f4e8cb','#8a4bc9'],P=[];
  const burst=(x,y,dir,n,delay)=>{for(let i=0;i<n;i++){const a=dir?-Math.PI/2+dir*(.25+Math.random()*.55):-Math.PI/2+(Math.random()-.5)*1.4,sp=(14+Math.random()*9)*Math.min(1.25,Math.max(.8,innerHeight/760));
    P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,
      f:Math.random()*6,vf:.12+Math.random()*.2,c:cols[i%cols.length],d:delay+Math.random()*.08,sw:Math.random()*1.5+.5})}};
  burst(0,H*.92,1,big?110:70,0);burst(W,H*.92,-1,big?110:70,0);burst(W*.5,H*.95,0,big?70:40,.35);
  if(big){burst(0,H*.7,1,70,.75);burst(W,H*.7,-1,70,.75);burst(W*.5,H*.95,0,60,1.3);
    for(let i=0;i<70;i++)P.push({x:Math.random()*W,y:-20-Math.random()*60,vx:(Math.random()-.5)*2,vy:1+Math.random()*2,w:7,h:7,r:0,vr:(Math.random()-.5)*.15,f:Math.random()*6,vf:.05,c:i%3?'#f2b33d':'#fff1b8',d:.5+Math.random()*1.6,sw:1,st:1});
    const fl=document.createElement('div');fl.className='scrflash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),600)}
  const t0=performance.now();let last=t0;
  (function step(now){const dt=Math.min(2,(now-last)/16.7),el=(now-t0)/1000;last=now;g.clearRect(0,0,W,H);let alive=0;
    for(const p of P){if(el<p.d){alive++;continue}
      p.vy+=.32*dt;p.vx*=Math.pow(.985,dt);p.vy*=Math.pow(p.vy>0?.96:.985,dt);if(p.vy>2.2)p.vy=2.2;
      p.f+=p.vf*dt;p.x+=(p.vx+Math.sin(p.f)*p.sw)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      if(p.y<H+20){alive++;g.save();g.translate(Math.round(p.x),Math.round(p.y));g.rotate(p.r);g.scale(1,Math.cos(p.f));
        const fe=big?5.2:3.2;g.globalAlpha=el>fe?Math.max(0,1-(el-fe)/.8):1;g.fillStyle=p.c;if(p.st){g.fillRect(-1.5,-5,3,10);g.fillRect(-5,-1.5,10,3)}else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}}
    if(alive&&el<(big?6:4))requestAnimationFrame(step);else cv.remove()})(t0);
  if(big)[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.4:.12,'square',.035,0,i*.1));else{tone(523,.1,'square',.03);tone(784,.16,'square',.03,0,.08)}}

  street:{trash:[.1,-1],manhole:[.82,4],mailbox:[.92,-1]},bar:{jar:[.12,-33],glass:[.86,-15],stool:[.14,3]},storm:{puddle:[.18,4],crate:[.88,-1],drain:[.7,3]},sea:{shell:[.1,1],chest:[.9,1],coral:[.72,-9]}};
function drawCont(R,type,x,y,open,t){const W_='#f4e8cb';
  const C={nest(){R.e(x,y,6,2,'#6e4a2e');R.r(x-5,y-2,10,1,'#8a6a3e');R.px(x-6,y-3,'#8a6a3e');R.px(x+5,y-3,'#8a6a3e');if(open)R.e(x,y-2,3,1,'#3a2414')},
    bush(){R.d(x-3,y-3,4,'#2f7a3a');R.d(x+3,y-3,4,'#2f7a3a');R.d(x,y-6,4,'#3f9a4a');if(open)R.e(x,y-4,2,2,'#1a3a20')},
    flowers(){for(const[dx,c]of[[-4,'#e2436b'],[0,'#f2c443'],[4,'#a87ad8']]){R.r(x+dx,y-5,1,5,'#3ea35b');R.d(x+dx,y-6,1,c)}if(open)R.r(x-1,y-1,3,1,'#5a3a20')},
    vase(){R.r(x-2,y-9,4,2,'#3f6fd8');R.r(x-3,y-7,6,7,'#3f6fd8');R.r(x-2,y-6,1,5,'#8ab0ff');if(open){R.r(x-2,y-10,4,1,'#1f3a8a')}},
    rug(){R.r(x-7,y-1,14,3,'#b8433a');R.r(x-7,y-1,14,1,'#e2b23a');if(open){R.r(x+3,y-3,4,2,'#b8433a');R.r(x+3,y-1,4,2,'#3a2414')}},
    box(){R.r(x-4,y-7,8,7,'#c8925e');R.r(x-4,y-7,8,1,'#e0b07a');R.r(x,y-7,1,7,'#8a5a33');if(open){R.r(x-5,y-9,4,2,'#e0b07a');R.r(x-3,y-6,6,2,'#3a2414')}},
    drawer(){R.r(x-6,y-4,12,5,'#5a3a48');R.r(x-1,y-2,2,1,'#e2b23a');if(open){R.r(x-6,y-1,12,3,'#7a5068');R.r(x-5,y-1,10,1,'#2a1a22')}},
    slipper(){R.e(x,y,4,2,'#f07aa8');R.r(x-2,y-2,4,1,'#ffb0cc');if(open)R.px(x+3,y-1,'#fff')},
    pillow(){R.e(x,y-2,6,3,'#e8e0f0');R.r(x-5,y-2,10,1,'#c8c0d8');if(open)R.e(x+3,y-3,3,2,'#c8c0d8')},
    trash(){R.r(x-4,y-9,8,9,'#7a808c');R.r(x-5,y-10,10,2,'#5a5e6a');for(let i=-3;i<4;i+=2)R.r(x+i,y-8,1,7,'#5a5e6a');if(open){R.r(x-6,y-13,9,2,'#5a5e6a');R.r(x-4,y-9,8,1,'#2a2630')}},
    manhole(){R.e(x,y,7,2,'#2a2d3e');R.e(x,y,5,1,'#3b3e52');if(open){R.e(x+4,y-1,6,2,'#4a4e62');R.e(x-2,y,4,1,'#0d0b14')}},
    mailbox(){R.r(x-3,y-14,7,9,'#3f6fd8');R.r(x-3,y-14,7,2,'#2f5fc0');R.r(x-1,y-11,4,1,'#1f3a8a');R.r(x,y-5,1,5,'#3e424c');if(open)R.r(x-3,y-12,7,3,'#1f3a8a')},
    jar(){R.r(x-3,y-6,6,6,'rgba(200,240,255,.55)');R.r(x-3,y-7,6,1,'#c8925e');R.r(x-2,y-5,1,4,'#fff');if(open)R.r(x-4,y-9,6,1,'#c8925e')},
    glass(){R.r(x-3,y-6,7,1,'#e8ffff');R.r(x-2,y-5,5,2,'rgba(255,120,160,.8)');R.r(x,y-3,1,3,'#e8ffff');R.r(x-2,y,5,1,'#e8ffff');if(open)R.px(x+2,y-7,'#fff')},
    stool(){R.e(x,y-6,5,1,'#b8433a');R.r(x-4,y-5,1,6,'#3e424c');R.r(x+3,y-5,1,6,'#3e424c');if(open)R.e(x+1,y-7,5,1,'#e26a5a')},
    puddle(){R.e(x,y,7,2,'#4a5a8a');R.e(x-2,y,3,1,'#8aa0d8');if(open)R.e(x,y,4,1,'#2a3a6a')},
    crate(){R.r(x-5,y-9,10,9,'#8a5a33');R.r(x-5,y-9,10,1,'#b8864e');R.line(x-5,y-9,x+4,y-1,'#5e3a1c');R.r(x-5,y-5,10,1,'#5e3a1c');if(open){R.r(x-6,y-12,8,2,'#b8864e');R.r(x-4,y-8,8,2,'#3a2414')}},
    drain(){R.r(x-5,y-1,10,3,'#2a2630');for(let i=-4;i<5;i+=2)R.r(x+i,y-1,1,3,'#5a5e6a');if(open)R.r(x-5,y-2,10,1,'#7a808c')},
    shell(){if(open){R.e(x,y-1,5,2,'#f0d8c8');R.e(x,y-4,5,2,'#e8b8a8');R.d(x,y-2,1,'#fff')}else{R.e(x,y-2,5,3,'#e8b8a8');for(const dx of[-3,0,3])R.line(x,y,x+dx,y-4,'#c08878')}},
    chest(){R.r(x-5,y-6,10,6,'#8a5a33');R.r(x-5,y-6,10,1,'#e2b23a');R.r(x-1,y-4,2,2,'#e2b23a');if(open){R.r(x-5,y-10,10,3,'#8a5a33');R.r(x-4,y-6,8,2,'#f2c443')}else R.r(x-5,y-8,10,2,'#6e4428')},
    coral(){R.r(x-1,y-8,2,8,'#ff7a8a');R.r(x-4,y-6,2,5,'#ff7a8a');R.r(x+3,y-7,2,6,'#ff9aa8');R.r(x-3,y-2,7,2,'#e85a6a');R.e(x,y-3,2,1,open?'#2a1f38':'#c84a5a')}};
  C[type]&&C[type]();
}
function hidPos(h){const sp=SPOT[h.env][h.cont];return[Math.round(W*sp[0]),GY+sp[1]]}
function maybeHid(cs){S.hid=null;if(!S.col.size||S.mode!=='play'||S.top||!SPOT[cs.env])return;const cand=COL.filter(it=>it.src[0]==='H'&&it.env===cs.env&&!owned(it.id));if(!cand.length)return;
  const x=Math.random();let r=x<.01?3:x<.04?2:x<.11?1:x<.26?0:-1;if(r<0)return;
  let pool=[];for(;r>=0&&!pool.length;r--)pool=cand.filter(c=>c.r===r);if(!pool.length)return;const it=pick(pool);S.hid={it,env:it.env,cont:it.cont,open:false}}
function drawHid(t){if(!S.hid)return;const[x,y]=hidPos(S.hid);drawCont(R(sctx),S.hid.cont,x,y,S.hid.open,t)}
stage.addEventListener('pointerdown',e=>{const h=S.hid;if(!h||h.open||S.phase!=='reveal'||S.mode!=='play')return;const r=cv.getBoundingClientRect();if(!r.width)return;
  let x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(S.fx.includes('upside')){x=W-x;y=H-y}if(S.fx.includes('mirror'))x=W-x;
  const[hx,hy]=hidPos(h);if(Math.abs(x-hx)<=9&&y>=hy-15&&y<=hy+6){h.open=true;sfx.open();bump(stage,'found');setTimeout(()=>{if(grant(h.it))flushCol(true)},380)}});

$('#colBtn').addEventListener('click',toCol);$('#colBack').innerHTML=bm(IC.grid);$('#colBack').addEventListener('click',toMap);
checkMeta();
$('#start').addEventListener('click',toMap);$('#mapHome').addEventListener('click',toTitle);$('#toMap').addEventListener('click',()=>{if(S.mode==='play')openQuit();else toMap()});
$('#shStart').addEventListener('click',e=>startDay(S.sel,e.currentTarget));
$('#resMap').addEventListener('click',toMap);$('#resRetry').addEventListener('click',e=>startDay(S.inf?'E':S.ch?'D':S.day,e.currentTarget));$('#resNext').addEventListener('click',e=>startDay(S.day+1,e.currentTarget));
$('#itRec').addEventListener('click',useRec);$('#itMag').addEventListener('click',useMag);btnNext.addEventListener('click',advance);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.querySelectorAll('[data-mute]').forEach(b=>b.addEventListener('click',()=>{ac();muted=!muted;try{localStorage.setItem('dbtd.muted',muted?'1':'0')}catch(e){}hud();music(MUS.want)}));
document.addEventListener('keydown',e=>{if(!modal.hidden||!adov.hidden)return;const k=e.key.toLowerCase();
  if(S.phase==='q'){const i='123456'.slice(0,S.cs.opts.length).indexOf(k);if(i>=0){choose(i);e.preventDefault()}}
  else if(S.phase==='reveal'&&(k==='enter'||k===' ')){e.preventDefault();advance()}
  else if(S.mode==='title'&&k==='enter')toMap()});
regen();
applyLang();hud();resize();show('title');attract();
})();
</script>
